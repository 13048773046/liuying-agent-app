name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry LiuyingAgent-1.0.0-unsigned.ipa Payload
          ls -lh LiuyingAgent-1.0.0-unsigned.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: liuying-agent-ios-unsigned
          path: LiuyingAgent-1.0.0-unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-unsigned
          name: 小萤 Agent 1.0.0 · 未签名 IPA
          body: |
            小萤 Agent 独立版 1.0.0（Android + iOS）。

            - 本附件为 iOS 未签名 IPA，需要 AltStore / Sideloadly / 自签工具安装。
            - Bundle ID：`com.liuying.agent`
            - 共用流萤社区 `/af` 后端，社区原版 Agent 保留。
          files: LiuyingAgent-1.0.0-unsigned.ipa
          fail_on_unmatched_files: true
