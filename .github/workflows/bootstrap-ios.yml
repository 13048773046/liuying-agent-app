name: Bootstrap and Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import source snapshot
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/source.zip 'https://aka.doubaocdn.com/s/UW72UaSJfm'
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          rsync -a \
            --exclude='.github' \
            --exclude='brand_src' \
            --exclude='build' \
            --exclude='.dart_tool' \
            /tmp/source/ ./
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/brand/splash_art.jpg

      - name: Commit imported source
        run: |
          set -euo pipefail
          git config user.name 'liuying-agent-bot'
          git config user.email 'liuying-agent-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat: import 小萤 Agent 独立 App 1.0.0 源码'
            git push
          fi
          git status --short

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags golden

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry LiuyingAgent-1.0.0-unsigned.ipa Payload
          ls -lh LiuyingAgent-1.0.0-unsigned.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: liuying-agent-ios-unsigned
          path: LiuyingAgent-1.0.0-unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-unsigned
          name: 小萤 Agent 1.0.0 · 未签名 IPA
          body: |
            小萤 Agent 独立版 1.0.0（Android + iOS）。

            - 本附件为 iOS 未签名 IPA，需要 AltStore / Sideloadly / 自签工具安装。
            - Bundle ID：`com.liuying.agent`
            - 共用流萤社区 `/af` 后端，社区原版 Agent 保留。
          files: LiuyingAgent-1.0.0-unsigned.ipa
          fail_on_unmatched_files: true
