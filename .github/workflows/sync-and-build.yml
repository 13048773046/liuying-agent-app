name: Build iOS 1.0.4 (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import 1.0.4 source snapshot
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/source.zip 'https://aka.doubaocdn.com/s/l8HHRn6AzD'
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          rsync -a \
            --exclude='.github' \
            --exclude='build' \
            --exclude='.dart_tool' \
            --exclude='android/key.properties' \
            --exclude='*.jks' \
            --exclude='*.keystore' \
            --exclude='release' \
            --exclude='test/failures' \
            --exclude='ios/Pods' \
            --exclude='ios/.symlinks' \
            /tmp/source/ ./
          test -f pubspec.yaml
          grep -q 'version: 1.0.4+5' pubspec.yaml
          test -f lib/pages/home/af_browser_handoff.dart
          test -f assets/brand/xiaoying_full.png

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test non-golden
        run: flutter test --exclude-tags golden

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry LiuyingAgent-1.0.4-unsigned.ipa Payload
          ls -lh LiuyingAgent-1.0.4-unsigned.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: liuying-agent-ios-unsigned-1.0.4
          path: LiuyingAgent-1.0.4-unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4-unsigned
          name: 小萤 Agent 1.0.4 · 未签名 IPA
          body: |
            小萤 Agent 独立版 1.0.4（iOS 未签名 IPA）。

            - AI 可打开 App 内浏览器，把登录 / 验证码 / 2FA / 支付 / 授权交给用户接管；用户点“完成，继续”后 AI 拿到当前网址、标题和可选页面摘要并继续执行。
            - 追问卡、文件交付卡与执行时间线保留。
            - 工作模式默认“计划 → 执行 → 观察 → 交付”，不设工具轮数上限。
            - Bundle ID：`com.liuying.agent`
            - 本附件为 iOS 未签名 IPA，需要 AltStore / Sideloadly / 自签工具安装。
            - 共用流萤社区 `/af` 后端，社区原版 Agent 保留。
          files: LiuyingAgent-1.0.4-unsigned.ipa
          fail_on_unmatched_files: true
