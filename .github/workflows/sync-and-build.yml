name: Build iOS 1.0.1 (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import 1.0.1 source snapshot
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/source.zip 'https://aka.doubaocdn.com/s/rqMVdBVLr1'
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          rsync -a \
            --exclude='.github' \
            --exclude='build' \
            --exclude='.dart_tool' \
            --exclude='android/key.properties' \
            --exclude='*.jks' \
            --exclude='*.keystore' \
            --exclude='release' \
            --exclude='test/failures' \
            --exclude='ios/Pods' \
            --exclude='ios/.symlinks' \
            /tmp/source/ ./
          test -f pubspec.yaml
          grep -q 'version: 1.0.1+2' pubspec.yaml
          test -f assets/brand/xiaoying_full.png

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test non-golden
        run: flutter test --exclude-tags golden

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry LiuyingAgent-1.0.1-unsigned.ipa Payload
          ls -lh LiuyingAgent-1.0.1-unsigned.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: liuying-agent-ios-unsigned-1.0.1
          path: LiuyingAgent-1.0.1-unsigned.ipa
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-unsigned
          name: 小萤 Agent 1.0.1 · 未签名 IPA
          body: |
            小萤 Agent 独立版 1.0.1（Android + iOS）。

            - 纸白日系漫画 UI，手机号验证码登录。
            - 原生启动图与图标，透明小萤立绘。
            - Bundle ID：`com.liuying.agent`
            - 本附件为 iOS 未签名 IPA，需要 AltStore / Sideloadly / 自签工具安装。
            - 共用流萤社区 `/af` 后端，社区原版 Agent 保留。
          files: LiuyingAgent-1.0.1-unsigned.ipa
          fail_on_unmatched_files: true
